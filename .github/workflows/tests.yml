name: Tests

on:
  push:
    branches:
      - op53-dev
  pull_request:
    branches:
      - op53-dev
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      
      - name: Build LuaJIT
        run: |
          make clean
          make -j$(nproc)
          make install PREFIX=$(pwd)
      
      - name: Run tests
        run: |
          cd tests
          ./run_tests.sh

